{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
    <h2>Products</h2>
    <div class="cards">
        {% for product in products %}
        <div class="card">
            <h3>{{ product.name }}</h3>
            <p class="price">${{ product.price }}</p>
            <a class="btn" href="{{ url_for('products.product_detail', product_id=product.id) }}">Details</a>
        </div>
        {% endfor %}
    </div>
{% endblock %}
