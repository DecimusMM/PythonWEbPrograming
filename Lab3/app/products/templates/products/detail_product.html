{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
    <h2>{{ product.name }}</h2>
    <p class="price">Price: ${{ product.price }}</p>
    <p>{{ product.content }}</p>
    <p><a class="btn" href="{{ url_for('products.product_list') }}">&larr; Back to products</a></p>
{% endblock %}
