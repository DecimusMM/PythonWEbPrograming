{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
    <nav class="side-nav">
        <ul>
            <li><a href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a></li>
            <li><a href="{{ url_for('users.admin') }}">Admin</a></li>
        </ul>
    </nav>

    <h2 class="hello">Hello :)</h2>
    <p class="user">User: {{ name }}</p>
    {% if age %}
        <p class="age age-ok">Age: {{ age }}</p>
    {% else %}
        <p class="age age-missing">Age: Not provided</p>
    {% endif %}
{% endblock %}
